<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crestfall mark">
  <!-- The Crestfall rosette: the gold Flower of Life sigil lifted
       from the chat room-media placeholder, promoted to the interim
       brand mark at Sprint 5.6. Interim: the elevated logo track
       delivers the final mark as a drop-in replacement.
       Stroke is the gold-ornament token from app/theme.css; a
       standalone SVG cannot read CSS variables, so the token's value
       rides along. (Note: XML comments may never contain a double
       hyphen; the token name is spelled out here so this file stays
       a valid image resource.) -->
  <g fill="none" stroke="#C9A86A" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width=".6">
      <circle cx="32" cy="32" r="10"/><circle cx="42" cy="32" r="10"/>
      <circle cx="37" cy="40.66" r="10"/><circle cx="27" cy="40.66" r="10"/>
      <circle cx="22" cy="32" r="10"/><circle cx="27" cy="23.34" r="10"/>
      <circle cx="37" cy="23.34" r="10"/>
    </g>
    <circle cx="32" cy="32" r="20" stroke-width=".6"/>
    <circle cx="32" cy="32" r="23" stroke-width="1"/>
  </g>
</svg>
